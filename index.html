<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Маленький сюрприз для тебя</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#fff1f4,#fff9ec);color:#573c50;font:16px "Trebuchet MS",sans-serif}.card{text-align:center;background:#ffffffc9;border:2px solid white;border-radius:30px;padding:28px;max-width:420px;width:92%;box-shadow:0 20px 60px #b6687e2e;animation:up .7s both}h1{font-size:2.2rem;margin:8px}.bunny{font-size:120px;line-height:1.5;animation:bob 2s infinite}.tag{color:#cf5478;font-weight:bold;letter-spacing:.12em;text-transform:uppercase}button{border:0;border-radius:30px;padding:13px 22px;background:#ed819e;color:white;font-weight:bold;font-size:1rem;cursor:pointer}#note{display:none;color:#cf5478;font-weight:bold;line-height:1.6}#note.show{display:block;animation:up .4s both}@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><main class="card"><div class="tag">маленький сюрприз</div><h1>Для самой<br>чудесной тебя</h1><div class="bunny" role="img" aria-label="Зайчик">🐰</div><p>Этот зайчик принёс тебе важное сообщение.<br>Нажми на кнопку ✨</p><button id="b" aria-expanded="false">Получить сообщение 💌</button><p id="note" aria-live="polite">Ты — моё любимое чудо 💕<br>Зайчик передаёт обнимашки!</p></main><script>const b=document.querySelector('#b'),n=document.querySelector('#note');b.onclick=()=>{let s=n.classList.toggle('show');b.setAttribute('aria-expanded',s);b.textContent=s?'Обнимашки приняты! 💞':'Получить сообщение 💌'}</script></html>
